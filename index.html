<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>TEAMRM - Posture &amp; Correction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="TEAMRM - Posture & Correction: avaliação postural por fotogrametria: 4 vistas, pontos anatômicos automáticos, ângulos e relatório PDF. Dados ficam no aparelho.">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script>try{var t=localStorage.getItem("teamrm-theme"),p=localStorage.getItem("teamrm-palette");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(p)document.documentElement.dataset.palette=p;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior fixa + coluna única de trabalho (máx. 1080px); na marcação, canvas + lista lado a lado no desktop. */
:root{
  /* TEAMRM: preto, amarelo da logo e branco */
  --bg:#F4F4F2; --surface:#FFFFFF; --sunken:#EBEAE6; --line:#DAD9D3;
  --ink:#111111; --muted:#5D5C57; --accent:#E79813; --accent-ink:#111111; --accent-text:#9A5B00; --brand:#0D0D0D; --brand-ink:#FFFFFF; --brand-muted:#B5B4AE;
  --ok:#17804A; --ok-bg:#E2F3E9; --warn:#A86200; --warn-bg:#FBEFD9; --bad:#C0283A; --bad-bg:#FBE3E6;
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gutr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --surface:#161616; --sunken:#212121; --line:#303030;
  --ink:#F3F3F1; --muted:#A5A49E; --accent:#F0A42A; --accent-ink:#111111; --accent-text:#F0A42A; --brand:#000000;
  --ok:#5BD08F; --ok-bg:#12301F; --warn:#F2B451; --warn-bg:#3A2A0E; --bad:#FF7A8A; --bad-bg:#3D1720; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#161616; --sunken:#212121; --line:#303030;
  --ink:#F3F3F1; --muted:#A5A49E; --accent:#F0A42A; --accent-ink:#111111; --accent-text:#F0A42A; --brand:#000000;
  --ok:#5BD08F; --ok-bg:#12301F; --warn:#F2B451; --warn-bg:#3A2A0E; --bad:#FF7A8A; --bad-bg:#3D1720; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
h1,h2,h3{font-family:var(--font-display);font-stretch:85%;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:750} h2{font-size:1.25rem;font-weight:700} h3{font-size:1rem;font-weight:650}
.num,.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:500 .72rem/1 var(--font-data);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);border-bottom:2px solid var(--accent)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:var(--gut);padding-right:var(--gutr)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--brand-ink);cursor:pointer;padding:0;flex-shrink:0}
.logo img{height:30px;width:auto;display:block}
.logo .brand{display:grid;text-align:left;line-height:1}
.logo b{font:780 1.15rem/1 var(--font-display);font-stretch:80%;letter-spacing:.02em}
.logo small{font:500 .62rem/1.3 var(--font-data);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav button{background:transparent;border:0;color:var(--brand-muted);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.top nav button:hover{color:var(--brand-ink)}
.top nav button[aria-current="page"]{color:var(--accent);background:rgba(255,255,255,.08)}
.themebtn{background:transparent;border:1px solid #3A3A3A;color:var(--brand-ink);width:36px;height:36px;border-radius:8px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.themebtn svg{width:18px;height:18px}

main{max-width:1080px;margin:0 auto;padding-block:20px 64px;padding-left:var(--gut);padding-right:var(--gutr);display:grid;gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:.95rem;width:100%}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}

/* Lista de pacientes */
.plist{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.prow:first-child{border-top:0}
.prow:hover{background:var(--sunken)}
.av{width:40px;height:40px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font:600 .9rem var(--font-display);color:var(--accent-text)}
.tag{display:inline-block;font:500 .7rem/1 var(--font-data);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:4px;background:var(--sunken);color:var(--muted);vertical-align:middle}

/* Status */
.st{display:inline-flex;align-items:center;gap:6px;font:500 .78rem/1 var(--font-body);padding:4px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);background:var(--ok-bg)} .st.warn{color:var(--warn);background:var(--warn-bg)} .st.bad{color:var(--bad);background:var(--bad-bg)} .st.na{color:var(--muted);background:var(--sunken)}

/* Vistas */
.views{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
@media (max-width:420px){.views{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
.slot .thumb{aspect-ratio:3/4;background:var(--sunken) repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px);display:grid;place-items:center;position:relative;max-width:100%}
.slot .thumb img,.slot .thumb canvas{width:100%;height:100%;object-fit:contain;display:block}
.slot .thumb .plumb{position:absolute;inset:0 auto 0 50%;border-left:1px dashed var(--muted);opacity:.5}
.slot .meta{padding:10px 12px;display:grid;gap:6px}
.slot .acts{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}

/* Marcação */
.mark{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.mark{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:#0B0E1A;border-radius:var(--r);overflow:hidden;touch-action:none;user-select:none}
.stage canvas{display:block;width:100%;height:auto;cursor:crosshair}
.loupe{position:absolute;top:10px;left:10px;width:132px;height:132px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none}
.tools{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.tools .btn{background:rgba(20,26,51,.85);color:#fff;border-color:rgba(255,255,255,.25)}
.plist2{display:grid;gap:2px;max-height:60vh;overflow:auto}
.pt{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;border:0;background:none;text-align:left;cursor:pointer;width:100%;font-size:.9rem}
.pt:hover{background:var(--sunken)}
.pt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pt i{font-style:normal;font:500 .72rem var(--font-data);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
.pt small{font-family:var(--font-data);font-size:.7rem;opacity:.75}
.banner{padding:10px 12px;border-radius:8px;background:var(--sunken);font-size:.9rem}
.banner.warn{background:var(--warn-bg);color:var(--warn)}

/* Resultados */
.res{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.res{grid-template-columns:minmax(0,1fr)}}
.res canvas{width:100%;height:auto;border-radius:8px;background:#0B0E1A;display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font:500 .72rem var(--font-data);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.v{font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
td .ref{display:block;font-size:.78rem;color:var(--muted)}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.summary .panel{display:grid;gap:4px}
.summary b{font:700 1.6rem/1 var(--font-display)}
ul.find{margin:0;padding-left:18px;display:grid;gap:4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:.9rem;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,12,24,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .panel{max-width:440px;width:100%;display:grid;gap:14px}
.biogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.bioblock summary{cursor:pointer;list-style-position:outside}
.unitin{display:flex;align-items:center;gap:6px}.unitin input{flex:1;min-width:0}.unitin em{font-style:normal;color:var(--muted);font-size:.85rem;min-width:30px}
.biocalc{color:var(--accent);font-size:.78rem;min-height:0}.biocalc:empty{display:none}
.biobar{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:.78rem;font-weight:700;color:#fff}
.biobar span{display:grid;place-items:center;white-space:nowrap;overflow:hidden}
.biolegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}.biolegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rbio{display:grid;place-items:center;width:100%;height:100%;font-size:1.6rem;background:var(--sunken)}
/* celular: "Salvar e concluir" sempre à vista na marcação de pontos */
@media (max-width:820px){.markdone{position:fixed;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:35;box-shadow:0 6px 18px rgba(0,0,0,.35);padding:12px}
  body:has(.markdone) main{padding-bottom:90px}}
.updbar{position:fixed;left:12px;right:12px;bottom:84px;z-index:60;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#0D0D0D;color:#fff;border:1px solid var(--accent);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
/* iPhone: campo com letra menor que 16px faz a tela dar zoom e ficar cortada */
@media (max-width:900px){input,select,textarea{font-size:16px!important}}
.lockscreen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
body.locked > :not(.lockscreen):not(.modal){visibility:hidden}
.lockbox{max-width:380px;width:100%;display:grid;gap:14px;text-align:left}
.lockscreen .lockbox{text-align:center}.lockscreen .lockbox .f{text-align:left}
.locklogo{height:56px;margin:0 auto;display:block;background:#0D0D0D;border-radius:12px;padding:8px 12px}
.lockmsg{margin:0;min-height:1.2em;color:#E5484D;font-size:.9rem}
.lockcode{font-size:1.5rem;font-weight:700;letter-spacing:.08em;text-align:center;background:var(--sunken);border-radius:10px;padding:12px;margin:0;user-select:all}
.pwwrap{position:relative;display:block}
.pwwrap input{width:100%;padding-right:46px}
.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.1rem;width:40px;height:40px;cursor:pointer;opacity:.55;border-radius:8px}
.pweye.on{opacity:1}.pweye:focus-visible{outline:2px solid var(--accent)}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .sw{background:var(--accent)}
.switch input:checked + .sw::after{transform:translateX(20px)}
.switch input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.empty{text-align:center;padding:36px 16px;display:grid;gap:10px;justify-items:center}
footer.disc{max-width:1080px;margin:0 auto;padding-block:0 32px;padding-left:var(--gut);padding-right:var(--gutr);font-size:.8rem;color:var(--muted)}

/* Paletas alternativas (a padrão é a TEAMRM) */
:root[data-palette="indigo"]{--brand:#1D2A6B;--accent:#2743D6;--accent-ink:#FFFFFF;--accent-text:#2743D6}
:root[data-palette="oceano"]{--brand:#0B4F5C;--accent:#0E7C86;--accent-ink:#FFFFFF;--accent-text:#0E7C86}
:root[data-palette="vinho"]{--brand:#5A1A32;--accent:#9B2C4F;--accent-ink:#FFFFFF;--accent-text:#9B2C4F}
@media (prefers-color-scheme: dark){
  :root[data-palette="indigo"]:not([data-theme="light"]){--brand:#1A2250;--accent:#7D92FF;--accent-ink:#0E1120;--accent-text:#7D92FF}
  :root[data-palette="oceano"]:not([data-theme="light"]){--brand:#0A3540;--accent:#4CC9D3;--accent-ink:#0A1A1E;--accent-text:#4CC9D3}
  :root[data-palette="vinho"]:not([data-theme="light"]){--brand:#3A1222;--accent:#F08AAA;--accent-ink:#2A0A16;--accent-text:#F08AAA}}
:root[data-theme="dark"][data-palette="indigo"]{--brand:#1A2250;--accent:#7D92FF;--accent-ink:#0E1120;--accent-text:#7D92FF}
:root[data-theme="dark"][data-palette="oceano"]{--brand:#0A3540;--accent:#4CC9D3;--accent-ink:#0A1A1E;--accent-text:#4CC9D3}
:root[data-theme="dark"][data-palette="vinho"]{--brand:#3A1222;--accent:#F08AAA;--accent-ink:#2A0A16;--accent-text:#F08AAA}

.top nav{overflow-x:auto;min-width:0;scrollbar-width:none}
.top nav button{white-space:nowrap}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.kind{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;text-align:left;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;font-size:.9rem}
.kind:hover{border-color:var(--accent)}
.kicon{width:44px;height:44px;border-radius:10px;background:var(--brand);color:var(--accent);display:grid;place-items:center;font:700 1.2rem var(--font-display)}
.tipday{border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:.92rem}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.excard{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px;align-content:start;font-size:.9rem}
.excard ol{margin:4px 0 0;padding-left:18px;display:grid;gap:2px}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y}
svg.chart .ax{font:11px var(--font-data);fill:var(--muted)}
.tip{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.8rem;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap}
.banner.bad{background:var(--bad-bg);color:var(--bad);font-weight:500}
.pt-row{display:flex;align-items:center;gap:2px}
.pt-row .pt{flex:1;min-width:0}
td .ref.ex{color:var(--ink);opacity:.8;margin-top:2px}
details summary{cursor:pointer}
.arow{grid-template-columns:1fr auto;cursor:default}
/* Celular: menu vira barra inferior */
@media (max-width:640px){
  .arow{grid-template-columns:1fr} .arow > .row{justify-content:flex-start!important}
  .top nav{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;background:var(--brand);border-top:2px solid var(--accent);display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));overflow:visible}
  .top nav button{padding:6px 2px 4px;font-size:.68rem;line-height:1.1;display:grid;justify-items:center;align-content:start;gap:2px;text-align:center;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top nav .n2{display:block;font-size:.6rem;opacity:.85} .top nav .nd{display:none}
  .themebtn{margin-left:auto}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  footer.disc{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}

/* Exercícios */
.exhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.excount{display:grid;justify-items:center;padding:4px 16px 4px 0;border-right:1px solid var(--line)}
.excount b{font:800 2rem/1 var(--font-display);color:var(--accent-text)} .excount span{font-size:.85rem;color:var(--muted)}
.exlist{display:grid;gap:8px;padding-bottom:72px}
.exrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.exmain{flex:1;min-width:0;display:flex;gap:12px;align-items:center;background:none;border:0;padding:10px;text-align:left;cursor:pointer;color:inherit}
.exmain svg{flex-shrink:0;background:var(--sunken);border-radius:10px}
.excheck{padding:14px;cursor:pointer} .excheck input{width:22px;height:22px;accent-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
